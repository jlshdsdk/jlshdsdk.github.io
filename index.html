<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的学习导航</title>
<style>
/* ==================================================
   --- 样式区域 ---
   想调整外观：直接改下面对应的颜色/数值，保存后刷新即生效
   ================================================== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #f5f7fa;   /* 页面背景 */
  color: #2c3e50;        /* 主文字颜色 */
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  line-height: 1.6;
}

/* 内容区域：最大1200px居中，两侧留白 */
.wrap { max-width: 1200px; margin: 0 auto; padding: 36px 20px 60px; }

/* 顶部标题与一句话简介 */
header h1 { font-size: 26px; }
header .sub { color: #7f8c9b; font-size: 14px; margin-top: 4px; }

/* 搜索框 */
#search {
  width: 100%; max-width: 520px;
  padding: 10px 16px; margin: 22px 0 4px;
  font-size: 16px; color: #2c3e50; background: #fff;
  border: 1px solid #e4e7ed; border-radius: 8px; outline: none;
}
#search:focus { border-color: #2980b9; }

/* 分类标题 */
.cat-title {
  color: #2980b9; font-size: 19px;
  margin: 28px 0 14px; padding-bottom: 8px;
  border-bottom: 1px solid #e4e7ed;
}

/* 卡片网格：电脑3列 / 平板2列 / 手机1列 */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

/* 网站卡片：悬停轻微上浮 + 阴影加深 */
.card {
  position: relative; display: block; padding: 15px 16px;
  background: #fff; border: 1px solid #e4e7ed; border-radius: 10px;
  color: #2c3e50; text-decoration: none;
  transition: transform .15s, box-shadow .15s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(44,62,80,.10); }
.card .name { font-weight: 700; font-size: 16px; padding-right: 26px; }
.card .desc { color: #8a94a0; font-size: 13px; margin-top: 4px; }

/* 收藏星标（卡片右上角） */
.star {
  position: absolute; top: 8px; right: 8px; padding: 4px;
  font-size: 18px; line-height: 1; color: #c0c8d0;
  cursor: pointer; user-select: none;
}
.star.on { color: #f39c12; }

/* 搜索无结果提示 */
.empty { color: #8a94a0; text-align: center; padding: 50px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>我的学习导航</h1>
    <p class="sub">点击卡片在新标签页打开网站；点击卡片右上角 ☆ 可收藏常用网站（保存在本机浏览器）</p>
  </header>
  <input id="search" type="search" placeholder="搜索网站名称、简介或分类…" aria-label="搜索网站">
  <main id="main"></main>
</div>

<script>
/* ==================================================
   --- 网站数据区【在此增删网站】 ---

   ★ 新增网站操作方法：
     复制下面任意一行对象，粘贴到列表末尾，改掉 4 项内容：
     { name: "网站名称", url: "完整链接", desc: "一句话简介", category: "所属分类" }
     注意：上一行行末要保留英文逗号。

   ★ 修改分类方法：
     1) 改某网站的分类 → 直接改该行的 category 值（写一个新分类名会自动生成新分组）
     2) 调整分组显示顺序 → 修改下面 CAT_ORDER 里文字的先后顺序

   ★ 删除网站 → 整行删掉即可，其余不用动。
   ※ 注意：各行的 url 不要重复，否则收藏状态会互相影响。
   ================================================== */
const SITES = [
  { name: "C语言入门", url: "https://jlshdsdk.github.io/ds-c-notes/#ch1-s1", desc: "C 语言零基础入门带学笔记", category: "408专业课" },
  { name: "数据结构", url: "https://jlshdsdk.github.io/data-structure-site/", desc: "数据结构课程同步带学", category: "408专业课" },
  { name: "操作系统", url: "https://jlshdsdk.github.io/kaoyan-408-os/", desc: "操作系统自学课程", category: "408专业课" },
  { name: "计算机组成原理", url: "https://jlshdsdk.github.io/kaoyan-408-coa/", desc: "计算机组成原理自学课程", category: "408专业课" },
  { name: "计算机网络", url: "https://jlshdsdk.github.io/kaoyan-408-networks/", desc: "计算机网络自学课程", category: "408专业课" },
  { name: "英一带学", url: "https://jlshdsdk.github.io/kaoyan-english1/", desc: "考研英语一真题带学", category: "考研英语" },
  { name: "背单词", url: "https://jlshdsdk.github.io/kaoyan-vocab5/", desc: "考研英语核心词汇记忆", category: "考研英语" },
  { name: "张宇1000题", url: "https://jlshdsdk.github.io/zhangyu-1000t/", desc: "张宇1000题题目与解析自学", category: "考研数学" },
  { name: "大模型Wiki", url: "https://jlshdsdk.github.io/my-wiki/", desc: "大模型自学笔记 wiki", category: "个人wiki" },
  /* ↑ 在这行上面复制粘贴新网站 */
];

/* 分类显示顺序（不在列表里的新分类会自动排在最后显示） */
const CAT_ORDER = ["408专业课", "考研英语", "考研数学", "个人wiki"];

/* ==================================================
   --- 交互逻辑 ---（下面的代码日常维护无需改动）
   ================================================== */
const KEY = "learnNavFavs";   /* 收藏数据在浏览器 localStorage 里的键名 */
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const getFavs = () => { try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; } };

/* 收藏 / 取消收藏 */
function toggleFav(url) {
  const f = getFavs(), i = f.indexOf(url);
  if (i > -1) { f.splice(i, 1); } else { f.push(url); }
  try { localStorage.setItem(KEY, JSON.stringify(f)); } catch (e) { /* 存储被禁用时静默降级，不影响浏览 */ }
}

/* 生成一张卡片 */
function cardHTML(s, fav) {
  return '<a class="card" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">'
    + '<span class="star' + (fav ? " on" : "") + '" role="button" tabindex="0" data-url="' + esc(s.url) + '" title="收藏 / 取消收藏">' + (fav ? "★" : "☆") + '</span>'
    + '<div class="name">' + esc(s.name || "") + '</div>'
    + '<div class="desc">' + esc(s.desc || "") + '</div></a>';
}

/* 渲染整页：常用收藏置顶，其余按分类分组 */
function render() {
  const q = $("#search").value.trim().toLowerCase();
  const favs = getFavs();
  const hit = s => !q || (s.name + " " + s.desc + " " + s.category).toLowerCase().indexOf(q) > -1;

  let html = "";

  /* 顶部「常用收藏」区 */
  const favList = SITES.filter(s => favs.indexOf(s.url) > -1 && hit(s));
  if (favList.length) {
    html += '<h2 class="cat-title">常用收藏</h2><div class="grid">'
          + favList.map(s => cardHTML(s, true)).join("") + '</div>';
  }

  /* 其余网站按分类分组（已收藏的只在顶部展示，不重复显示） */
  const groups = [];
  CAT_ORDER.forEach(c => groups.push([c, []]));
  SITES.forEach(s => {
    if (!hit(s) || favs.indexOf(s.url) > -1) return;
    let g = null;
    for (const x of groups) { if (x[0] === s.category) { g = x; break; } }
    if (!g) { g = [s.category, []]; groups.push(g); }
    g[1].push(s);
  });
  groups.forEach(g => {
    if (g[1].length) {
      html += '<h2 class="cat-title">' + esc(g[0]) + '</h2><div class="grid">'
            + g[1].map(s => cardHTML(s, false)).join("") + '</div>';
    }
  });

  $("#main").innerHTML = html || '<p class="empty">没有找到匹配的网站，换个关键词试试</p>';
}

/* 点击星标：切换收藏（阻止卡片跳转；支持键盘 Tab + 回车） */
document.addEventListener("click", onStar);
document.addEventListener("keydown", onStar);
function onStar(e) {
  const st = e.target.closest(".star");
  if (!st || (e.type === "keydown" && e.key !== "Enter")) return;
  e.preventDefault();
  toggleFav(st.getAttribute("data-url"));
  render();
}

/* 搜索：输入即时筛选 */
$("#search").addEventListener("input", render);

render();
</script>

<!--
【维护速查】完整零基础教程见仓库 README.md
【增删网站】记事本打开本文件，搜「网站数据区」：
  新增 = 复制一行改4项（category 写新名字会自动建新分组；上一行末尾英文逗号别丢）
  删除 = 删整行；修改 = 直接改那行文字
  保存后到 GitHub 仓库页 Add file → Upload files 覆盖上传 index.html，约 1 分钟生效
【重新部署】新建 Public 仓库并上传本文件，Settings → Pages →
  Branch 选 main 与 /(root) 保存，即得 https://用户名.github.io/仓库名/
字段含义：name=卡片标题 url=链接 desc=简介 category=分组名
收藏保存在各设备浏览器本地，换设备需重新点 ☆
-->
</body>
</html>
